    />

    <!--
      GitHub Pages SPA fallback: public/404.html stores the requested deep link
      in the query string and redirects here; this restores the real path
      before React Router boots. No-op on Docker/nginx (which rewrites to
      index.html server-side) and for normal root visits.
    -->
    <script>
      // Mark JS as available so the scroll-reveal hidden state applies only
      // when it can actually be undone (see .js .reveal in index.css).
      document.documentElement.classList.add('js')
      // GitHub Pages SPA deep-link restore (see public/404.html).
      ;(function () {
        var r = new URLSearchParams(window.location.search).get('redirect')
        if (r) {
          window.history.replaceState(null, '', r)
        }
      })()
    </script>

    <script type="application/ld+json">

          { "@type": "Organization", "name": "Kaimur Farms" },
          { "@type": "Organization", "name": "KVI Tech" }
        ]
      }
    </script>
