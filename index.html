<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#1e3d2d" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#12261c" />

    <title>Kaimur Valley Innovations | Growing agriculture. Building enterprises.</title>
    <meta
      name="description"
      content="Kaimur Valley Innovations (KVI) is an AgroTech-led company building businesses around agriculture, food processing, rural infrastructure and software — through KVI Greens, KV Infra and KVI Tech."
    />
    <!-- No static canonical / og:url: this one HTML file is served for every
         route, so a hard-coded "/" would contradict the per-route values that
         useDocumentMeta sets. Scrapers without JS then fall back to the
         requested URL instead of the homepage. -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="Kaimur Valley Innovations" />
    <meta property="og:title" content="Kaimur Valley Innovations | Growing agriculture. Building enterprises." />
    <meta
      property="og:description"
      content="An AgroTech-led company building businesses around agriculture, food processing, rural infrastructure and software."
    />
    <meta property="og:image" content="https://kvinnovations.in/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kaimur Valley Innovations — Growing agriculture. Building enterprises. Enabling progress." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kaimur Valley Innovations" />
    <meta
      name="twitter:description"
      content="An AgroTech-led company building businesses around agriculture, food processing, rural infrastructure and software."
    />
    <meta name="twitter:image" content="https://kvinnovations.in/og.png" />

    <!-- Fonts: Fraunces (editorial serif, h1/h2) + Inter / Inter Tight (UI). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Mark JS as available so the scroll-reveal hidden state applies only
      // when it can actually be undone (see .js .reveal in index.css).
      document.documentElement.classList.add('js')
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kaimur Valley Innovations",
        "legalName": "Kaimur Valley Innovations Pvt. Ltd.",
        "alternateName": "KVI",
        "url": "https://kvinnovations.in/",
        "logo": "https://kvinnovations.in/apple-touch-icon.png",
        "description": "An AgroTech-led company building businesses around agriculture, food processing, rural infrastructure and software.",
        "email": "kaimurvalleyinnovations@gmail.com",
        "telephone": "+91-87559-48184",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Bihar",
          "addressCountry": "IN"
        },
        "subOrganization": [
          { "@type": "Organization", "name": "KVI Greens", "url": "https://kvinnovations.in/greens" },
          { "@type": "Organization", "name": "KV Infra", "url": "https://kvinnovations.in/infra" },
          { "@type": "Organization", "name": "KVI Tech", "url": "https://kvinnovations.in/tech" }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 1rem; font-family: sans-serif">
        Kaimur Valley Innovations — please enable JavaScript to view this site, or
        write to kaimurvalleyinnovations@gmail.com.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
