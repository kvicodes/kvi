server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind kvi-proxy (Caddy terminates TLS), so emit relative Location
    # headers — an absolute one would point at http:// and cost an extra hop.
    absolute_redirect off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/javascript application/json
        image/svg+xml application/xml;

    # Baseline security headers (safe for a static marketing site).
    # NOTE: nginx drops inherited add_header directives in any location that
    # sets its own, so these are repeated in the blocks below that do.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Renamed routes (Kaimur Farms -> KVI Greens). Permanent, so search engines
    # move the old URL's standing across.
    location = /farms {
        return 301 /greens;
    }
    # /businesses was folded into the About page.
    location = /businesses {
        return 301 /about#verticals;
    }

    # SPA routing. Known routes have a dist/<route>/index.html carrying their own
    # metadata (scripts/prerender-meta.mjs); anything else falls back to the SPA.
    # Use $uri/index.html here, not $uri/: the directory form makes nginx 301
    # /greens to /greens/, which breaks the canonical URLs.
    # Every page is HTML through this block, so it is never cached.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }

    # Long-cache fingerprinted assets; keep HTML uncached
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|mp4|woff|woff2|ttf)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }
}
