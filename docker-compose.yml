# KVI group website — deployment for the shared KVI host.
#
# A single static container: nginx serving the built SPA (see Dockerfile).
# No database, no API — so, unlike CampusGrid, there is no base/overlay split:
# this file is never shipped to a client, it only ever runs on the KVI host
# behind the standalone kvi-proxy Caddy (kvi-proxy/Caddyfile,
# kvi-proxy/docs/migration.md).
#
# Network model (KVI shared-host standard — see
# kvi-proxy/docs/current-architecture.md §1.4, which already reserves the name
# "kvi-website-internal" for this app):
#
#   kvi-website-internal  this project's private network (nothing else joins it)
#   kvi-proxy             pre-existing shared external network; the Caddy
#                         container reaches this one by name  ->  kvi-website:80
#
# There are NO host port mappings: kvi-proxy/Caddy is the only public entry
# point (kvinnovations.in -> reverse_proxy kvi-website:80, www -> 301 apex).
# The temporary "8080:80" fallback used during migration Phases 2-3 was
# removed at the Phase 4 cutover.

services:
  kvi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kvi-website
    restart: unless-stopped
    networks:
      - default
      - kvi-proxy

networks:
  # This project's private network (renamed from the Compose default
  # "kvi_default" to the KVI naming convention).
  default:
    name: kvi-website-internal

  # Pre-existing shared reverse-proxy network. Created once per host
  # (`docker network create kvi-proxy`) and owned by no single project —
  # never created or redefined here. `external: true` makes Compose fail
  # loudly if it is somehow missing rather than silently making a new one.
  kvi-proxy:
    external: true
    name: kvi-proxy
